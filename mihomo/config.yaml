    url: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.yaml
    path: ./RuleProviders/AWAvenue-Ads-Rule-Clash.yaml
  private:
    <<: *domain
    url: https://raw.githubusercontent.com/Yuu518/Yuu-rules/rule-set/mihomo/geosite/private.yaml
    path: ./RuleProviders/private.yaml
  googlefcm:
    <<: *domain
    url: https://raw.githubusercontent.com/Yuu518/Yuu-rules/rule-set/mihomo/geosite/googlefcm.yaml
    path: ./RuleProviders/googlefcm.yaml
  category-ai-!cn:
    <<: *domain
    url: https://raw.githubusercontent.com/Yuu518/Yuu-rules/rule-set/mihomo/geosite/category-ai-!cn.yaml
    path: ./RuleProviders/category-ai-!cn.yaml
  google:
    <<: *domain
    url: https://raw.githubusercontent.com/Yuu518/Yuu-rules/rule-set/mihomo/geosite/google.yaml
    path: ./RuleProviders/google.yaml
  github:
    <<: *domain
    url: https://raw.githubusercontent.com/Yuu518/Yuu-rules/rule-set/mihomo/geosite/github.yaml
    path: ./RuleProviders/github.yaml
  telegram:
    <<: *domain
    url: https://raw.githubusercontent.com/Yuu518/Yuu-rules/rule-set/mihomo/geosite/telegram.yaml
    path: ./RuleProviders/telegram.yaml
  geolocation-!cn@cn:
    <<: *domain_text
    url: https://raw.githubusercontent.com/nekolsd/sing-geosite/domain-set/geolocation-!cn@cn.txt
    path: ./RuleProviders/geolocation-!cn@cn.list
  cn@!cn:
    <<: *domain_text
    url: https://raw.githubusercontent.com/nekolsd/sing-geosite/domain-set/cn@!cn.txt
    path: ./RuleProviders/cn@!cn.list
  geolocation-!cn:
    <<: *domain
    url: https://raw.githubusercontent.com/Yuu518/Yuu-rules/rule-set/mihomo/geosite/geolocation-!cn.yaml
    path: ./RuleProviders/geolocation-!cn.yaml
  cn:
    <<: *domain
    url: https://raw.githubusercontent.com/Yuu518/Yuu-rules/rule-set/mihomo/geosite/cn.yaml
    path: ./RuleProviders/cn.yaml

  geoip-private:
    <<: *ip
    url: https://raw.githubusercontent.com/Yuu518/Yuu-rules/rule-set/mihomo/geoip/private.yaml
    path: ./RuleProviders/geoip-private.yaml
  geoip-google:
    <<: *ip
    url: https://raw.githubusercontent.com/Yuu518/Yuu-rules/rule-set/mihomo/geoip/google.yaml
    path: ./RuleProviders/geoip-google.yaml
  geoip-telegram:
    <<: *ip
    url: https://raw.githubusercontent.com/Yuu518/Yuu-rules/rule-set/mihomo/geoip/telegram.yaml
    path: ./RuleProviders/geoip-telegram.yaml
  geoip-cn:
    <<: *ip
    url: https://raw.githubusercontent.com/Yuu518/Yuu-rules/rule-set/mihomo/geoip/cn.yaml
